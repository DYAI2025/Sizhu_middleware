# Codex CLI — sizhu-mcp-server via the mcp-remote stdio↔HTTP bridge (universal, every Codex version).
# Place under ~/.codex/config.toml. Export SIZHU_TOKEN (admin + aal2 Sizhu access token) first.
# Deployed endpoint below; for a local server swap to http://localhost:3399/mcp.
[mcp_servers.sizhu]
command = "npx"
args = ["-y", "mcp-remote", "https://talented-victory-production.up.railway.app/mcp", "--header", "Authorization: Bearer ${SIZHU_TOKEN}"]
